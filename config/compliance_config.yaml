# Universal Compliance Orchestrator Configuration

# -----------------------------------------------------------------------------
# FRAMEWORK SOURCES
# If local_path does not exist, the sync script will attempt to fetch from remote_url
# -----------------------------------------------------------------------------
frameworks:
  nist_csf:
    local_path: "nist-csf/README.md"
    remote_url: "https://raw.githubusercontent.com/local-ai-grc/nist-csf/main/README.md"
  jupiterone:
    local_path: "jupiterone-policies/templates/policies"
    remote_url: "https://github.com/JupiterOne/security-policy-templates.git"
    type: "git" # 'file' or 'git'
  comply:
    local_path: "comply/example/policies"
    remote_url: "https://github.com/strongdm/comply.git"
    type: "git"

# -----------------------------------------------------------------------------
# TOOL CONFIGURATION (100% Open Source / Free)
# -----------------------------------------------------------------------------
tools:
  checkov:
    enabled: true
    # Runs entirely locally using Checkov's OSS engine
    soft_fail: true
  semgrep:
    enabled: true
    # Uses Semgrep's free community rulesets. Enterprise tokens are disabled.
    config:
      - "p/security-audit"
      - "p/secrets"
      - "p/default"
  trivy:
    enabled: true
    images: []  # container images, e.g. ["myapp:latest"]
    # Requires local trivy binary (OSS)
    # Available at: https://github.com/aquasecurity/trivy
  osv:
    enabled: true
    # Queries the Google OSV API for real-time package vulnerabilities (SCA).
    # Workspace-aware: walks the target dir for requirements.txt, package.json,
    # Cargo.lock, go.sum, Gemfile.lock, composer.lock (PyPI/npm/crates.io/Go/
    # RubyGems/Packagist).
  cargo_audit:
    enabled: true
    # Runs entirely locally using the RUSTSEC advisory database (OSS).
    # Requires the `cargo-audit` binary (`cargo install cargo-audit`).
    # Available at: https://github.com/rustsec/rustsec/tree/main/cargo-audit
  nuclei:
    enabled: true
    # Live-target template scanning (OSS). Requires the `nuclei` binary.
    # Runs against network_targets (placeholder example.com defaults are never scanned).
    # Available at: https://github.com/projectdiscovery/nuclei
    severity: "critical,high,medium"  # optional filter: subset of critical,high,medium,low,info
  scorecard:
    enabled: true
    # OpenSSF Scorecard supply-chain posture incl. SLSA-relevant checks (OSS).
    # Requires the `scorecard` binary; derives the GitHub slug from the target's
    # git origin (non-GitHub checkouts skip cleanly). Auth comes from
    # GITHUB_AUTH_TOKEN env only, never this file.
    # Available at: https://github.com/ossf/scorecard
    min_score: 7  # checks scoring below this (0-10 scale) produce findings
  trufflehog:
    enabled: true
    # Verified-secret scan of the working tree (OSS). Requires the `trufflehog` binary.
    # Reports only verifier-confirmed credentials; values never enter findings/logs.
    # Available at: https://github.com/trufflesecurity/trufflehog

    
# -----------------------------------------------------------------------------
# DAST & LIVE NETWORK AUDITING
# Define APIs and websites to aggressively scan for security headers,
# TLS configuration, and information leaks.
# -----------------------------------------------------------------------------
network_targets:
  - "https://example.com"
  - "https://api.example.com/health"

# -----------------------------------------------------------------------------
# DAST CRAWL/FUZZ + EMAIL AUTH (R-052 / R-055)
# Authenticated DAST is env-only (DAST_AUTH_HEADER / DAST_AUTH_COOKIE) -
# never put session credentials in this file. Unauthenticated is default.
# -----------------------------------------------------------------------------
dast:
  enabled: true
  crawl: true        # same-origin link-follow, GET-only
  max_depth: 2       # link-follow depth bound (also DAST_MAX_DEPTH)
  max_pages: 20      # total pages bound (also DAST_MAX_PAGES)
  fuzz: true         # light query-param probes, GET-only (also DAST_MAX_FUZZ)
  max_fuzz_requests: 20
email_auth:
  enabled: true      # SPF/DKIM/DMARC TXT checks for each network-target domain
  selectors: ["default", "google", "selector1", "selector2", "k1"]
  domains: []        # extra domains beyond network-target hosts

# -----------------------------------------------------------------------------
# TLS POSTURE - stdlib SSL handshake per network-target host: negotiated
# version, cipher strength, certificate expiry and hostname match.
# No new binary. Placeholder example.com defaults are never dialed.
# -----------------------------------------------------------------------------
tls:
  enabled: true
  timeout: 10          # per-host handshake timeout (also TLS_TIMEOUT)

# -----------------------------------------------------------------------------
# LIVE CLOUD POSTURE (R-051) - read-only polling, env creds only.
# Absent creds/SDKs skip gracefully, never fail. Snapshot baseline enables
# diff-on-rerun drift detection.
# -----------------------------------------------------------------------------
cloud:
  enabled: true
  providers: ["aws", "gcp", "azure"]
  baseline_file: "reports/cloud_posture_baseline.json"

# -----------------------------------------------------------------------------
# SBOM + LICENSE COMPLIANCE (R-054)
# -----------------------------------------------------------------------------
sbom:
  enabled: true
  format: "cyclonedx"  # or "spdx"
  output: "reports/sbom.cyclonedx.json"
licenses:
  allowlist: ["MIT", "Apache-2.0", "BSD-2-Clause", "BSD-3-Clause", "ISC",
    "Python-2.0", "CC0-1.0", "Unlicense"]
  flag_unknown_licenses: false  # true = LOW finding per undeclared license
  overrides: {}      # {package-name: SPDX-id} for licenses manifests omit

# -----------------------------------------------------------------------------
# GLOBAL SETTINGS

# -----------------------------------------------------------------------------
settings:
  fail_on_high: false
  output_dir: "reports"
  mapping_file: "scripts/framework_mappings.json"
  metadata_file: "scripts/framework_metadata.json"
